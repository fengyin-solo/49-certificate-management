<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资质证书管理系统</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>资质证书管理系统</h1>
  </header>
  <main>
    <section id="stats-section">
      <h2>统计看板</h2>
      <div id="stats-cards"></div>
    </section>
    <section id="cert-section">
      <h2>证书列表</h2>
      <table id="cert-table">
        <thead>
          <tr>
            <th>编号</th>
            <th>名称</th>
            <th>分类</th>
            <th>持有人</th>
            <th>发证机构</th>
            <th>签发日期</th>
            <th>到期日期</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <section id="expiring-section">
      <h2>即将到期</h2>
      <table id="expiring-table">
        <thead>
          <tr><th>编号</th><th>名称</th><th>到期日期</th><th>剩余天数</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
